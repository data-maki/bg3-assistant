<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">BG3 Honor Telemetry</title>
  <desc id="desc">An original bronze shield and telemetry pulse on a dark green field.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="74%">
      <stop offset="0" stop-color="#203d35"/>
      <stop offset="0.58" stop-color="#11241f"/>
      <stop offset="1" stop-color="#090f0d"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d486"/>
      <stop offset="0.28" stop-color="#c99a45"/>
      <stop offset="0.66" stop-color="#8a5b28"/>
      <stop offset="1" stop-color="#e0bd70"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#field)"/>
  <circle cx="228" cy="110" r="330" fill="#b2833c" opacity="0.035"/>
  <circle cx="1100" cy="610" r="410" fill="#3ee8a4" opacity="0.025"/>
  <path d="M0 618 C232 552 350 672 586 606 S1002 538 1280 602 V720 H0Z" fill="#000" opacity="0.2"/>

  <g transform="translate(126 122)" filter="url(#shadow)">
    <path d="M250 0 436 70v149c0 126-69 222-186 277C133 441 64 345 64 219V70Z" fill="#0b1412" stroke="url(#bronze)" stroke-width="12"/>
    <path d="M250 24 410 84v135c0 108-58 192-160 244C148 411 90 327 90 219V84Z" fill="url(#glass)" stroke="#d5ad63" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M108 244h76l28-87 52 174 42-126 32 74h60" fill="none" stroke="#6ff0b1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="108" cy="244" r="9" fill="#f0ce7e"/>
    <circle cx="398" cy="279" r="9" fill="#f0ce7e"/>
  </g>

  <g transform="translate(610 218)">
    <text x="0" y="0" fill="#d7b56d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="7">OPTIONAL COMPANION BRIDGE</text>
    <text x="0" y="88" fill="#f5f1e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2">HONOR</text>
    <text x="0" y="164" fill="#f5f1e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2">TELEMETRY</text>
    <rect x="0" y="206" width="480" height="2" fill="url(#bronze)" opacity="0.75"/>
    <text x="0" y="258" fill="#b9c5c0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500">Read-only events. Manual progress.</text>
    <g transform="translate(0 306)">
      <circle cx="14" cy="14" r="14" fill="#55df9d"/>
      <path d="m7 14 5 5 10-11" fill="none" stroke="#0c1814" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="22" fill="#e5e0d3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650">Vanilla fallback always available</text>
    </g>
  </g>

  <rect x="18" y="18" width="1244" height="684" rx="32" fill="none" stroke="#d1a456" stroke-width="2" opacity="0.36"/>
</svg>
