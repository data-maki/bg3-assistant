name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    name: Swift build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: ./scripts/macos/validate.sh

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        working-directory: backend
        run: uv run --extra dev pytest -q

  windows:
    name: Windows ${{ matrix.architecture }} build, test, publish & package
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: windows-11-arm
            expected_os_architecture: Arm64
            expected_dotnet_architecture: arm64
            evidence_label: ARM64 Windows CI
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          global-json-file: windows/global.json
      - name: Verify OS, PowerShell, SDK and .NET host architecture
        shell: pwsh
        run: |
          $runtime = [System.Runtime.InteropServices.RuntimeInformation]
          $osArchitecture = $runtime::OSArchitecture
          $powerShellArchitecture = $runtime::ProcessArchitecture
          if ($osArchitecture -ne '${{ matrix.expected_os_architecture }}') {
            throw "Expected ${{ matrix.expected_os_architecture }} OS; found $osArchitecture."
          }
          if ($powerShellArchitecture -ne '${{ matrix.expected_os_architecture }}') {
            throw "Expected ${{ matrix.expected_os_architecture }} PowerShell; found $powerShellArchitecture."
          }
          $sdkVersion = (dotnet --version).Trim()
          if ($sdkVersion -ne '10.0.302') {
            throw "Expected .NET SDK 10.0.302; found $sdkVersion."
          }
          $dotnetInfo = dotnet --info | Out-String
          $hostBlock = [regex]::Match(
            $dotnetInfo,
            '(?ms)^Host:\s*\r?\n(?<body>.*?)(?:\r?\n\r?\n|\z)').Groups['body'].Value
          if ($hostBlock -notmatch "(?im)^\s*Architecture:\s*${{ matrix.expected_dotnet_architecture }}\s*$") {
            throw "Expected ${{ matrix.expected_dotnet_architecture }} .NET host.`n$dotnetInfo"
          }
          "Evidence context: ${{ matrix.evidence_label }}"
          "OS=$osArchitecture; PowerShell=$powerShellArchitecture; SDK=$sdkVersion; .NET=${{ matrix.expected_dotnet_architecture }}"
      - name: Restore locked dependencies
        run: >
          dotnet restore BG3HonorAssistant.slnx
          --locked-mode
          -p:BG3Architecture=${{ matrix.architecture }}
      - name: Build
        run: >
          dotnet build BG3HonorAssistant.slnx
          --configuration Release
          --no-restore
          -p:BG3Architecture=${{ matrix.architecture }}
      - name: Test on matching-architecture Windows runner
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem tests -Recurse -Filter '*.Tests.csproj' |
            Sort-Object FullName)
          if ($projects.Count -eq 0) {
            throw 'No explicit Windows test projects were discovered.'
          }
          foreach ($project in $projects) {
              [xml]$projectXml = Get-Content -Raw -LiteralPath $project.FullName
              $isTestProject = @($projectXml.Project.PropertyGroup.IsTestProject)
              if ($isTestProject -notcontains 'true') {
                throw "$($project.FullName) must explicitly set IsTestProject=true."
              }

              $resultsDirectory = "artifacts/test-results/${{ matrix.architecture }}"
              $resultPath = Join-Path $resultsDirectory "$($project.BaseName).trx"
              Remove-Item -LiteralPath $resultPath -Force -ErrorAction SilentlyContinue
              $foregroundJob = $null
              if ($project.BaseName -eq 'BG3HonorAssistant.Windows.Tests') {
                # GitHub's desktop is headless, so Windows rejects the synthetic
                # host's SetForegroundWindow call unless it receives real input.
                # Keep the strict foreground assertion and drive only the
                # controlled bg3/bg3_dx11 test windows while this suite runs.
                $foregroundJob = Start-Job -ScriptBlock {
                  Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class ControlledFocusDriver { [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr handle, out Rect rect); [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow(); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr handle); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint x, uint y, uint data, UIntPtr extra); }'
                  $deadline = [DateTime]::UtcNow.AddMinutes(3)
                  while ([DateTime]::UtcNow -lt $deadline) {
                    $hostProcesses = Get-Process bg3,bg3_dx11,GameWindowHost -ErrorAction SilentlyContinue
                    foreach ($hostProcess in $hostProcesses) {
                      $windowHandle = $hostProcess.MainWindowHandle
                      if ($windowHandle -eq 0 -or
                          [ControlledFocusDriver]::GetForegroundWindow() -eq $windowHandle) {
                        continue
                      }

                      $bounds = [ControlledFocusDriver+Rect]::new()
                      if ([ControlledFocusDriver]::GetWindowRect($windowHandle, [ref]$bounds)) {
                        $x = [Math]::Max(20, [Math]::Min($bounds.Right - 20, $bounds.Left + 60))
                        $y = [Math]::Max(20, [Math]::Min($bounds.Bottom - 20, $bounds.Top + 60))
                        [void][ControlledFocusDriver]::SetCursorPos($x, $y)
                        [ControlledFocusDriver]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero)
                        [ControlledFocusDriver]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
                        [void][ControlledFocusDriver]::SetForegroundWindow($windowHandle)
                      }
                    }

                    Start-Sleep -Milliseconds 100
                  }
                }
              }

              try {
                dotnet test $project.FullName `
                  --configuration Release `
                  --no-build `
                  --no-restore `
                  --logger "trx;LogFileName=$($project.BaseName).trx" `
                  --results-directory $resultsDirectory `
                  -p:BG3Architecture=${{ matrix.architecture }}
                $testExitCode = $LASTEXITCODE
              }
              finally {
                if ($null -ne $foregroundJob) {
                  Stop-Job $foregroundJob
                  Remove-Job $foregroundJob
                }
              }
              if ($testExitCode -ne 0) {
                throw "Tests failed for $($project.FullName)."
              }
              if (-not (Test-Path -LiteralPath $resultPath)) {
                throw "Test project $($project.FullName) did not produce $resultPath."
              }
              [xml]$trx = Get-Content -Raw -LiteralPath $resultPath
              $executed = [int]$trx.TestRun.ResultSummary.Counters.executed
              if ($executed -le 0) {
                throw "Test project $($project.FullName) executed zero tests."
              }
              "$($project.BaseName): executed=$executed; testhost=${{ matrix.architecture }}"
          }
      - name: Publish self-contained application
        shell: pwsh
        run: >
          ./tools/build-release.ps1
          -Architecture ${{ matrix.architecture }}
      - name: Verify packaging architecture interface
        shell: pwsh
        run: |
          $command = Get-Command ./tools/build-development-msix.ps1
          $architecture = $command.Parameters['Architecture']
          if ($null -eq $architecture) {
            throw 'Packaging script must expose a mandatory -Architecture parameter.'
          }
          $validateSet = $architecture.Attributes |
            Where-Object { $_ -is [System.Management.Automation.ValidateSetAttribute] } |
            Select-Object -First 1
          if ($null -eq $validateSet -or
              (@($validateSet.ValidValues | Sort-Object) -join ',') -ne 'arm64,x64') {
            throw 'Packaging -Architecture must accept exactly arm64 and x64.'
          }
          if ($null -eq $command.Parameters['Version']) {
            throw 'Packaging script must expose the expected -Version parameter.'
          }
      - name: Build architecture-specific development MSIX
        shell: pwsh
        run: >
          ./tools/build-development-msix.ps1
          -Architecture ${{ matrix.architecture }}
          -Version 0.1.0.0
      - name: Inspect publish and package architecture
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts `
            -Filter "BG3HonorAssistant_0.1.0.0_${{ matrix.architecture }}_unsigned.msix" `
            -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.architecture }} MSIX; found $($packages.Count)."
          }
          ./tools/inspect-architecture.ps1 `
            -Architecture ${{ matrix.architecture }} `
            -PublishPath "artifacts/publish/win-${{ matrix.architecture }}" `
            -PackagePath $packages[0].FullName `
            -EvidencePath "artifacts/architecture-${{ matrix.architecture }}.json"
      - name: Upload architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            windows/artifacts/*.msix
            windows/artifacts/architecture-${{ matrix.architecture }}.json
            windows/artifacts/test-results/${{ matrix.architecture }}/*.trx
