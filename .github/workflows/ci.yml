name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    name: Swift build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: ./scripts/macos/validate.sh

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        working-directory: backend
        run: uv run --extra dev pytest -q

  windows:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore windows/src/BG3HonorAssistant.App/BG3HonorAssistant.App.csproj --locked-mode
      - name: Build
        run: dotnet build windows/src/BG3HonorAssistant.App/BG3HonorAssistant.App.csproj --configuration Release --no-restore
