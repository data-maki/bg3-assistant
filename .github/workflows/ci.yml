name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    name: Swift build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: ./scripts/macos/validate.sh

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        working-directory: backend
        run: uv run --extra dev pytest -q

  windows:
    name: Windows ${{ matrix.architecture }} build, test, publish & package
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            expected_os_architecture: X64
            evidence_label: x64 Windows CI (not native-x64 hardware)
          - architecture: arm64
            runner: windows-11-arm
            expected_os_architecture: Arm64
            evidence_label: ARM64 Windows CI
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify runner architecture
        shell: pwsh
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($actual -ne '${{ matrix.expected_os_architecture }}') {
            throw "Expected ${{ matrix.expected_os_architecture }} runner; found $actual."
          }
          "Evidence context: ${{ matrix.evidence_label }}"
          dotnet --info
      - name: Restore locked dependencies
        run: >
          dotnet restore BG3HonorAssistant.slnx
          --locked-mode
          -p:BG3Architecture=${{ matrix.architecture }}
      - name: Build
        run: >
          dotnet build BG3HonorAssistant.slnx
          --configuration Release
          --no-restore
          -p:BG3Architecture=${{ matrix.architecture }}
      - name: Test on matching-architecture Windows runner
        shell: pwsh
        run: |
          Get-ChildItem tests -Recurse -Filter '*.Tests.csproj' |
            Sort-Object FullName |
            ForEach-Object {
              dotnet test $_.FullName `
                --configuration Release `
                --no-build `
                --no-restore `
                --logger "trx;LogFileName=$($_.BaseName).trx" `
                --results-directory "artifacts/test-results/${{ matrix.architecture }}" `
                -p:BG3Architecture=${{ matrix.architecture }}
              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed for $($_.FullName)."
              }
            }
      - name: Publish self-contained application
        shell: pwsh
        run: >
          ./tools/build-release.ps1
          -Architecture ${{ matrix.architecture }}
      - name: Build architecture-specific development MSIX
        shell: pwsh
        run: >
          ./tools/build-development-msix.ps1
          -Architecture ${{ matrix.architecture }}
          -Version 0.1.0.0
      - name: Inspect publish and package architecture
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts `
            -Filter "BG3HonorAssistant_0.1.0.0_${{ matrix.architecture }}_unsigned.msix" `
            -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.architecture }} MSIX; found $($packages.Count)."
          }
          ./tools/inspect-architecture.ps1 `
            -Architecture ${{ matrix.architecture }} `
            -PublishPath "artifacts/publish/win-${{ matrix.architecture }}" `
            -PackagePath $packages[0].FullName `
            -EvidencePath "artifacts/architecture-${{ matrix.architecture }}.json"
      - name: Upload architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            windows/artifacts/*.msix
            windows/artifacts/architecture-${{ matrix.architecture }}.json
            windows/artifacts/test-results/${{ matrix.architecture }}/*.trx
