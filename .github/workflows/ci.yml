name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    name: Swift build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: ./scripts/macos/validate.sh

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        working-directory: backend
        run: uv run --extra dev pytest -q
