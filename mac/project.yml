name: BG3HonorAssistant
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  BG3HonorAssistant:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BG3Assistant
        excludes:
          - Resources/BuildOptionIcons
          - Resources/CompanionPortraits
          - Resources/ItemIcons
      - path: BG3Assistant/Resources/BuildOptionIcons
        type: folder
        buildPhase: resources
      - path: BG3Assistant/Resources/CompanionPortraits
        type: folder
        buildPhase: resources
      - path: BG3Assistant/Resources/ItemIcons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.BG3HonorAssistant
        INFOPLIST_FILE: BG3Assistant/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
