name: BG3HonorAssistant
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  BG3HonorAssistant:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BG3Assistant
      - path: ../Resources
        excludes:
          - BuildOptionIcons
          - CompanionPortraits
          - ItemIcons
      - path: ../Resources/BuildOptionIcons
        type: folder
        buildPhase: resources
      - path: ../Resources/CompanionPortraits
        type: folder
        buildPhase: resources
      - path: ../Resources/ItemIcons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.BG3HonorAssistant
        INFOPLIST_FILE: ../Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
